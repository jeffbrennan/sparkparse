name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Runs when a PR is opened, pushed to (synchronize), reopened, or marked
# ready. Concurrent runs for the same ref are cancelled so a stale push cannot
# leave the PR showing old results.

# Only a run from one of these pull_request events can satisfy branch
# protection. A workflow_dispatch run does NOT: its check suite is not
# associated with the pull request, so the check lands on the commit but the
# required context on the PR stays unfulfilled. Verified on PR #20, where
# `test` and `test-full` both passed on the head sha while the PR stayed
# BLOCKED. Merge queue (merge_group) would be the tidier answer but is not
# available on this account.
#
# Branch protection on `main` requires `test` and `test-full` to pass before
# merge. Update contexts WITHOUT clobbering the rest of the config:
#   gh api -X PATCH repos/jeffbrennan/sparkparse/branches/main/protection/required_status_checks \
#     -f 'contexts[]=test' -f 'contexts[]=test-full'
#
# The full-object PUT below replaces everything and silently drops any setting
# it does not restate; prefer the PATCH above.
#   gh api -X PUT repos/jeffbrennan/sparkparse/branches/main/protection --input - <<'EOF'
#   {
#     "required_status_checks": {
#       "strict": false,
#       "contexts": ["test"]
#     },
#     "enforce_admins": false,
#     "restrictions": null,
#     "required_pull_request_reviews": null
#   }
#   EOF

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Resolve nothing at CI time: install exactly what uv.lock pins.
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check sparkparse/ tests/

      - name: Format check
        run: uv run ruff format --check sparkparse/ tests/

      - name: Type check
        run: uv run pyrefly check sparkparse/ tests/

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/test.py --ignore=tests/test_capture.py -v

  packaging:
    # Builds the wheel once and proves the optional-dependency boundaries in
    # fresh environments: base parsing/CLI must work without PySpark or Dash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Verify base install (no PySpark, no Dash)
        run: |
          uv venv /tmp/base --python 3.11
          wheel=$(ls dist/*.whl)
          uv pip install --python /tmp/base/bin/python "$wheel"
          /tmp/base/bin/python - <<'PY'
          import sys
          import sparkparse  # noqa: F401
          assert "pyspark" not in sys.modules, "base install pulled in pyspark"
          assert "dash" not in sys.modules, "base install pulled in dash"
          print("base import ok")
          PY
          /tmp/base/bin/sparkparse --version
          /tmp/base/bin/sparkparse --help >/dev/null

      - name: Verify [viz] install
        run: |
          uv venv /tmp/viz --python 3.11
          wheel=$(ls dist/*.whl)
          uv pip install --python /tmp/viz/bin/python "${wheel}[viz]"
          /tmp/viz/bin/python -c "import sparkparse.dashboard; print('viz import ok')"

      - name: Verify [spark] install
        run: |
          uv venv /tmp/spark --python 3.11
          wheel=$(ls dist/*.whl)
          uv pip install --python /tmp/spark/bin/python "${wheel}[spark]"
          /tmp/spark/bin/python -c "import sparkparse; sparkparse.SparkparseCapture; print('spark import ok')"

