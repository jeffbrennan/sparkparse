name: test

on:
  pull_request:
    types: [opened, reopened]
  merge_group:
  workflow_dispatch:

# Runs when a PR is opened or reopened, and again when a PR is queued to merge
# (merge_group) -- not on every push, to keep runner usage down.
#
# The merge_group run is what gates the merge. A workflow_dispatch run does NOT:
# its check suite is not associated with the pull request, so the check lands on
# the commit but never satisfies the required context on the PR. Before the merge
# queue was adopted, a PR pushed to after opening stayed BLOCKED with no way to
# clear it except closing and reopening the PR.
#
# Branch protection on `main` requires the `test` check to pass before merge:
#   gh api -X PUT repos/jeffbrennan/sparkparse/branches/main/protection --input - <<'EOF'
#   {
#     "required_status_checks": {
#       "strict": false,
#       "contexts": ["test"]
#     },
#     "enforce_admins": false,
#     "restrictions": null,
#     "required_pull_request_reviews": null
#   }
#   EOF

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check sparkparse/ tests/

      - name: Format check
        run: uv run ruff format --check sparkparse/ tests/

      - name: Type check
        run: uv run pyrefly check sparkparse/ tests/

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/test.py --ignore=tests/test_capture.py -v
