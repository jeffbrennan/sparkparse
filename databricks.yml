bundle:
  name: sparkparse

# The wheel filename includes the package version, so keep it in one place.
# Build with `just build-wheel`, then override if needed:
#   databricks bundle deploy --var wheel_path=dist/sparkparse-<version>-py3-none-any.whl
variables:
  wheel_path:
    description: Path to the built sparkparse wheel inside the synced bundle files.
    default: dist/sparkparse-0.1.0-py3-none-any.whl

# Force-sync the pre-built wheel even if dist/ is gitignored.
# Run `uv build --wheel` before `databricks bundle deploy`.
sync:
  include:
    - "dist/*.whl"

targets:
  dev:
    mode: development
    default: true

resources:
  jobs:
    sparkparse_demo:
      name: "[dev ${workspace.current_user.userName}] sparkparse-demo"
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              # Databricks serverless runtime provides: pandas, numpy, fsspec, pyarrow, pyspark.
              # Only list packages the runtime does NOT include.
              - /Workspace/Users/${workspace.current_user.userName}/.bundle/sparkparse/dev/files/${var.wheel_path}
              - "polars>=1.24.0"
              - "pydantic>=2.10.6"
              - "dash-bootstrap-components>=1.6.0,<2"
              - "dash-cytoscape>=1.0.2"
              - "dash-ag-grid>=31.3.0"
      tasks:
        - task_key: run_demo
          notebook_task:
            notebook_path: ./notebooks/sparkparse_demo.py
          environment_key: default

    sparkparse_validate_connect:
      name: "[dev ${workspace.current_user.userName}] sparkparse-validate-connect"
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - /Workspace/Users/${workspace.current_user.userName}/.bundle/sparkparse/dev/files/${var.wheel_path}
              - "polars>=1.24.0"
              - "pydantic>=2.10.6"
      tasks:
        - task_key: validate_connect_capture
          notebook_task:
            notebook_path: ./notebooks/validate_connect_capture.py
          environment_key: default

    sparkparse_debug_serverless:
      name: "[dev ${workspace.current_user.userName}] sparkparse-debug-serverless"
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              # Databricks serverless runtime provides: pandas, numpy, fsspec, pyarrow, pyspark.
              # Only list packages the runtime does NOT include.
              - /Workspace/Users/${workspace.current_user.userName}/.bundle/sparkparse/dev/files/${var.wheel_path}
              - "polars>=1.24.0"
              - "pydantic>=2.10.6"
      tasks:
        - task_key: debug_node_types
          notebook_task:
            notebook_path: ./notebooks/debug_serverless_node_types.py
          environment_key: default
